<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRTS Scout Dashboard</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --accent: #3b82f6; --accent-hover: #2563eb; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 40px; margin: 0; min-height: 100vh; }
        h1 { text-align: center; font-size: 3rem; margin-bottom: 5px; font-weight: 800; background: linear-gradient(90deg, #60a5fa, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 50px; font-size: 1.1rem; }
        .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); transition: all 0.3s ease; border: 1px solid #334155; position: relative; overflow: hidden; }
        .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--accent), #a855f7); opacity: 0; transition: opacity 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3); border-color: #475569; }
        .card:hover::before { opacity: 1; }
        .company { font-size: 0.85rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px;}
        .company .tag { background: #334155; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; color: #94a3b8; }
        .title { font-size: 1.35rem; font-weight: 700; margin: 0 0 16px 0; line-height: 1.3; color: #fff; }
        .date { font-size: 0.8rem; color: #64748b; margin-bottom: 24px; display: flex; align-items: center; gap: 4px;}
        .apply-btn { align-self: flex-start; background: var(--accent); color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; transition: background 0.2s, transform 0.1s; display: inline-block;}
        .apply-btn:hover { background: var(--accent-hover); transform: scale(1.02); }
        .empty-state { text-align: center; grid-column: 1 / -1; padding: 80px; color: #64748b; font-size: 1.2rem; background: var(--card-bg); border-radius: 16px; border: 1px dashed #475569; }
    </style>
</head>
<body>
    <h1>GRTS Scout</h1>
    <p class="subtitle">Your localized, AI-powered discovery feed</p>
    <div class="feed" id="feed-container">
        <div class="empty-state">Loading feed...</div>
    </div>

    <script>
        async function loadFeed() {
            try {
                // Fetch from json
                const res = await fetch('scout_feed.json');
                if (!res.ok) throw new Error("Feed not found");
                const data = await res.json();
                
                const container = document.getElementById('feed-container');
                container.innerHTML = ''; // Clear loading state
                
                if (!data || data.length === 0) {
                    container.innerHTML = `<div class="empty-state">No new roles found. Time to configure your targets and run scout.py!</div>`;
                    return;
                }

                data.forEach(job => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="company">${job.company} <span class="tag">NEW</span></div>
                            <h3 class="title">${job.title}</h3>
                            <div class="date"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Discovered: ${job.discovered_at}</div>
                        </div>
                        <a href="${job.url}" target="_blank" class="apply-btn">View Application</a>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('feed-container').innerHTML = `<div class="empty-state" style="color:#ef4444;">Error loading feed: scout_feed.json may not exist yet. Ensure you are running a local dev server (e.g., <code>python -m http.server</code>) and have run <code>scout.py</code>.</div>`;
            }
        }
        loadFeed();
    </script>
</body>
</html>
