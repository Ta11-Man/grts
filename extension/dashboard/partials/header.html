<div class="header">
        <div class="brand">
          <img src="grts-logo.svg" class="logo" alt="GRTS Logo" />
          <div>
            <h1>GRTS <span>Workspace</span></h1>
            <div
              style="
                font-size: 0.82rem;
                color: var(--text-muted);
                font-weight: 500;
              "
            >
              Reverse Tracking System, Pipeline Analytics, Resume Git & Autofill
              Engine
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-primary-gold" id="openAddModalBtn">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Application
          </button>
                    <button class="action-btn" id="openEmailSyncModalBtn" style="display: inline-flex; align-items: center; gap: 6px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            Email Auto-Sync
          </button>
          <button class="action-btn" id="refreshBtn">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path
                d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
              ></path>
            </svg>
            Refresh
          </button>
        </div>
      </div>

      <!-- ANALYTICS FUNNEL METRICS BAR (CLICK TO FILTER) -->
      <div
        class="metrics-grid"
        id="metricsBar"
        style="grid-template-columns: repeat(auto-fit, minmax(170px, 1fr))"
      >
        <div
          class="metric-card"
          id="mTotalAppsCard"
          title="Click to show all applications"
        >
          <div class="metric-title">Total Applications</div>
          <div class="metric-value" id="mTotalApps">-</div>
          <div class="metric-sub" id="mActiveApps">- unique companies</div>
        </div>
        <div
          class="metric-card"
          id="mSavedCard"
          title="Click to filter Saved Jobs"
        >
          <div class="metric-title">Saved Jobs</div>
          <div class="metric-value" id="mSavedApps" style="color: #4f46e5">
            0
          </div>
          <div class="metric-sub">Bookmarked for later</div>
        </div>
        <div
          class="metric-card"
          id="mInterviewingCard"
          title="Click to show upcoming / active interviewing rounds"
        >
          <div class="metric-title">Interviewing</div>
          <div
            class="metric-value"
            id="mInterviews"
            style="color: var(--warning)"
          >
            -
          </div>
          <div class="metric-sub">Active rounds</div>
        </div>
        <div
          class="metric-card"
          id="mOffersCard"
          title="Click to filter offers"
        >
          <div class="metric-title">Offers</div>
          <div class="metric-value" id="mOffers" style="color: var(--success)">
            -
          </div>
          <div class="metric-sub" id="mOfferRate">0% offer rate</div>
        </div>
        <div
          class="metric-card"
          id="mHearbackCard"
          title="Click to filter roles with company responses"
        >
          <div class="metric-title">Hearback Rate</div>
          <div class="metric-value" id="mResponseRate">-</div>
          <div class="metric-sub" id="mResponseSub">- including rejections</div>
        </div>
      </div>

      <!-- CONTROLS & VIEWS NAVIGATION -->
      <div class="controls-bar">
        <div class="view-tabs">
          <button class="view-tab-btn active" data-view="view-table">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
            Table
          </button>
          <button class="view-tab-btn" data-view="view-kanban">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
            </svg>
            Kanban
          </button>
          <button class="view-tab-btn" data-view="view-analytics">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="20" x2="18" y2="10"></line>
              <line x1="12" y1="20" x2="12" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
            Analytics & Stats
          </button>
          <button class="view-tab-btn" data-view="view-resumes">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            Resume Versions
          </button>
          <button class="view-tab-btn" data-view="view-qa">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            Q&A Bank
          </button>
          <button class="view-tab-btn" data-view="view-profile">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Autofill Profile
          </button>
          <button class="view-tab-btn" data-view="view-import-export">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Import / Export
          </button>
        </div>

        <div class="filter-tools">
          <div class="search-box">
            <input
              type="text"
              id="globalSearchInput"
              placeholder="Search company, role, notes..."
            />
          </div>
          <select id="sortBySelect" class="filter-select">
            <option value="recency">Most Recent</option>
            <option value="priority">Excitement Rating (1-5)</option>
            <option value="company">Company (A-Z)</option>
            <option value="status">Status Stage</option>
          </select>
          <select id="statusFilterSelect" class="filter-select">
            <option value="">All Applications (Active)</option>
            <option value="Saved">Saved / Bookmarked</option>
            <option value="Applied">Applied</option>
            <option value="Online Assessment (OA)">
              Online Assessment (OA)
            </option>
            <option value="Recruiter Screen">Recruiter Screen</option>
            <option value="Technical Interview">Technical Interview</option>
            <option value="Final Round / Onsite">Final Round / Onsite</option>
            <option value="Offer">Offer</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
      </div>

      <!-- 1. TABLE VIEW -->
